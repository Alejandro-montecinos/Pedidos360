spring.application.name=ventas

spring.web.error.include-binding-errors=always
spring.web.error.include-message=always

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/pedidos360?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

springdoc.swagger-ui.path=/ventas.html
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.operations-sorter=alpha

server.port=${VENTAS_SERVER_PORT:6767}

# Microservicio pedidosBackend (Catálogo de productos)
microservice.pedidos-backend.url=${PEDIDOS_BACKEND_URL:http://localhost:4545}

# RabbitMQ
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USERNAME:guest}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:guest}
