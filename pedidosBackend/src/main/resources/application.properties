spring.application.name=pedidosBackend

spring.web.error.include-binding-errors=always
spring.web.error.include-message=always

# Configuración de Base de Datos leyendo variables de entorno
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/pedidos360?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.maximum-pool-size=10

springdoc.swagger-ui.path=/productos.html
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.operations-sorter=alpha

server.port=${BACKEND_SERVER_PORT:4545}

# RabbitMQ
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USERNAME:guest}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:guest}