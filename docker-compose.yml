version: '3.8'

services:
  pedidos-backend:
    build:
      context: ./pedidosBackend
      dockerfile: Dockerfile
    container_name: pedidos-backend
    restart: always
    ports:
      - "${BACKEND_SERVER_PORT:-4545}:4545"
    environment:
      - BACKEND_SERVER_PORT=4545
      - DB_URL=${DB_URL:-jdbc:mysql://db-pedidos360.cb0gk4weo997.us-east-1.rds.amazonaws.com:3306/pedidos360?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
      - DB_USERNAME=${DB_USERNAME:-admin}
      - DB_PASSWORD=${DB_PASSWORD:-Duoc.2025}
      - RABBITMQ_HOST=rabbitmq
      - KAFKA_BOOTSTRAP_SERVERS=${KAFKA_BOOTSTRAP_SERVERS:-kafka:29092}
    depends_on:
      - rabbitmq
      - kafka
    healthcheck:
      test: [ "CMD-SHELL", "wget -q --spider http://localhost:4545/api-docs || exit 1" ]
      interval: 15s
      timeout: 5s
      retries: 5

  pedidos-bff:
    build:
      context: ./bff/bff
      dockerfile: Dockerfile
    container_name: pedidos-bff
    restart: always
    ports:
      - "${BFF_SERVER_PORT:-8080}:8080"
    environment:
      - BFF_SERVER_PORT=8080
      - AZURE_TENANT_ID=${AZURE_TENANT_ID:-86938a4d-8211-441d-8c29-09b3a9a53b48}
      - AZURE_CLIENT_ID=${AZURE_CLIENT_ID:-68ea7d4c-e7d0-41bf-80da-b4efd986c72b}
      - AZURE_APP_ID_URI=${AZURE_APP_ID_URI:-api://68ea7d4c-e7d0-41bf-80da-b4efd986c72b}
      - AZURE_FRONTEND_CLIENT_ID=${AZURE_FRONTEND_CLIENT_ID:-2d53fcc2-04a2-4f88-b43f-9a48ec27d992}
      - MICROSERVICE_PEDIDOS_URL=http://pedidos-backend:4545
      - MICROSERVICE_VENTAS_URL=http://ventas-backend:6767
    depends_on:
      pedidos-backend:
        condition: service_healthy
      ventas-backend:
        condition: service_started

  pedidos-frontend:
    build:
      context: ./pedidos360-frontend
      dockerfile: Dockerfile
    container_name: pedidos-frontend
    restart: always
    ports:
      - "3000:80"
    depends_on:
      - pedidos-bff

  ventas-backend:
    build:
      context: ./ventas
      dockerfile: Dockerfile
    container_name: ventas-backend
    restart: always
    ports:
      - "${VENTAS_SERVER_PORT:-6767}:6767"
    environment:
      - VENTAS_SERVER_PORT=6767
      - DB_URL=${DB_URL:-jdbc:mysql://db-pedidos360.cb0gk4weo997.us-east-1.rds.amazonaws.com:3306/pedidos360?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
      - DB_USERNAME=${DB_USERNAME:-admin}
      - DB_PASSWORD=${DB_PASSWORD:-Duoc.2025}
      - RABBITMQ_HOST=rabbitmq
      - PEDIDOS_BACKEND_URL=http://pedidos-backend:4545
      - KAFKA_BOOTSTRAP_SERVERS=${KAFKA_BOOTSTRAP_SERVERS:-kafka:29092}
    depends_on:
      - rabbitmq
      - kafka
      - pedidos-backend

  rabbitmq:
    image: rabbitmq:4.2-management
    container_name: pedidos360-rabbitmq
    restart: always
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq

  kafka:
    image: apache/kafka:4.4.0
    container_name: pedidos360-kafka
    restart: always
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:29092,PLAINTEXT_HOST://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
    volumes:
      - kafka_data:/var/lib/kafka/data

  administrativo:
    build:
      context: ./administrativo_
      dockerfile: Dockerfile
    container_name: pedidos360-administrativo
    restart: always
    ports:
      - "${ADMIN_SERVER_PORT:-9090}:9090"
    environment:
      - ADMIN_SERVER_PORT=9090
      - RABBITMQ_HOST=rabbitmq
      - KAFKA_BOOTSTRAP_SERVERS=${KAFKA_BOOTSTRAP_SERVERS:-kafka:29092}
    depends_on:
      - rabbitmq
      - kafka

volumes:
  rabbitmq_data:
  kafka_data:
